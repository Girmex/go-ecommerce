basePath: /
definitions:
  http.ChargeRequest:
    properties:
      amount:
        example: 59.98
        type: number
      method:
        enum:
        - card
        - wallet
        - bank_transfer
        example: card
        type: string
      order_id:
        example: b3c1d7e2-1234-4567-8901-abcdef123456
        type: string
      user_id:
        example: 1234567890
        type: integer
    required:
    - amount
    - method
    - order_id
    - user_id
    type: object
  http.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
      validation_errors:
        items:
          $ref: '#/definitions/http.FieldError'
        type: array
    type: object
  http.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  http.PaymentResponse:
    properties:
      amount:
        type: number
      checkout_url:
        type: string
      created_at:
        type: string
      gateway_txn_ref:
        type: string
      id:
        type: string
      method:
        type: string
      order_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8083
info:
  contact: {}
  description: Payment microservice for the eCommerce application.
  title: Payment Service API
  version: "1.0"
paths:
  /payments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.PaymentResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List authenticated user's payments
      tags:
      - payments
    post:
      consumes:
      - application/json
      description: Creates a payment and initializes the payment gateway checkout.
      parameters:
      - description: Charge payload
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/http.ChargeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Charge a payment for an order
      tags:
      - payments
  /payments/{id}:
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PaymentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a payment by ID
      tags:
      - payments
  /payments/{id}/refund:
    post:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PaymentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refund a payment
      tags:
      - payments
securityDefinitions:
  BearerAuth:
    description: Enter your JWT token with the Bearer prefix.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
