basePath: /
definitions:
  http.CreateProductRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        example: Wireless Mouse
        maxLength: 150
        minLength: 2
        type: string
      price:
        example: 29.99
        type: number
      stock:
        example: 100
        minimum: 0
        type: integer
    required:
    - name
    - price
    - stock
    type: object
  http.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
      validation_errors:
        items:
          $ref: '#/definitions/http.FieldError'
        type: array
    type: object
  http.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  http.ProductResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  http.ReserveStockRequest:
    properties:
      quantity:
        example: 2
        type: integer
    required:
    - quantity
    type: object
  http.UpdateProductRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 150
        minLength: 2
        type: string
      price:
        type: number
      stock:
        minimum: 0
        type: integer
    type: object
host: localhost:8081
info:
  contact: {}
  description: Product microservice for the eCommerce application.
  title: Product Service API
  version: "1.0"
paths:
  /products:
    get:
      description: Returns all products.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.ProductResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Creates a new product.
      parameters:
      - description: Product payload
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/http.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      description: Deletes a product by its ID. Only the product owner can delete
        it.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      description: Returns a product by its ID.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get a product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Updates an existing product. Only the product owner can update
        it.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product fields
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/http.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
  /products/{id}/reserve:
    post:
      consumes:
      - application/json
      description: Reserves product stock for an order.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Stock reservation
        in: body
        name: reserve
        required: true
        schema:
          $ref: '#/definitions/http.ReserveStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Reserve product stock
      tags:
      - products
securityDefinitions:
  BearerAuth:
    description: Enter your JWT token with the Bearer prefix.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
