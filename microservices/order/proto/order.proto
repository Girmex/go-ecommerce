syntax = "proto3";

package order.v1;

option go_package = "github.com/Girmex/go-ecommerce/microservices/order/api/proto;proto";

import "google/protobuf/empty.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_AWAITING_PAYMENT = 2;
  ORDER_STATUS_PAID = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_SHIPPED = 5;
  ORDER_STATUS_DELIVERED = 6;
}

message OrderItem {
  uint32 id = 1;
  uint32 product_id = 2;
  uint32 quantity = 3;
  double unit_price = 4;
}

message Order {
  uint32 id = 1;
  uint32 user_id = 2;
  OrderStatus status = 3;
  repeated OrderItem items = 4;
  double total_price = 5;
}

message OrderItemRequest {
  uint32 product_id = 1;
  uint32 quantity = 2;
}

message CreateOrderRequest {
  repeated OrderItemRequest items = 1;
}

message GetOrderRequest {
  uint32 id = 1;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}
message UpdateOrderStatusRequest {
  uint32 id = 1;
  OrderStatus status = 2;
}
service OrderService {

  rpc CreateOrder(CreateOrderRequest)
      returns (Order);

  rpc GetOrder(GetOrderRequest)
      returns (Order);

  rpc ListOrders(google.protobuf.Empty)
      returns (ListOrdersResponse);

  rpc CancelOrder(GetOrderRequest)
      returns (google.protobuf.Empty);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest)
    returns (Order);
}