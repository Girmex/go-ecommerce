basePath: /
definitions:
  http.CreateUserRequest:
    properties:
      email:
        example: test@example.com
        type: string
      name:
        example: Test User
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: testpwd123
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  http.ErrorResponse:
    properties:
      message:
        type: string
      validation_errors:
        items:
          $ref: '#/definitions/http.FieldError'
        type: array
    type: object
  http.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        example: test@example.com
        type: string
      password:
        example: testpwd123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  http.LoginResponse:
    properties:
      email:
        example: test@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Test User
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
  http.UserResponse:
    properties:
      email:
        example: test@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Test User
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: User microservice for the eCommerce application.
  title: User Service API
  version: "1.0"
paths:
  /users:
    post:
      consumes:
      - application/json
      description: Creates a new user.
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Create user
      tags:
      - Users
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Login
      tags:
      - Users
  /users/me:
    get:
      description: Returns the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
